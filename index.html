<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Image Slider</title>
<link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="slider-container">
        <div class="slides">
            <div class="slide">
                <img src="https://picsum.photos/id/239/1000/500" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/238/1000/500" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/237/1000/500" alt="Slide 3">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/233/1000/500" alt="Slide 3">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/232/1000/500" alt="Slide 3">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/231/1000/500" alt="Slide 3">
            </div>

        </div>
        <button class="nav-button prev" onclick="prevSlide()">&#10094;</button>
        <button class="nav-button next" onclick="nextSlide()">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
